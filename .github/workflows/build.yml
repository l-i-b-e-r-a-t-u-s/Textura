# Builds the installers on every tag that starts with v and attaches them to the release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build build --target Textura_AU Textura_VST3 Textura_Standalone
      - run: tools/package_mac.sh 1.0.0
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: dist/*.pkg }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target Textura_VST3 Textura_Standalone
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\textura.iss'
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
